# .github/workflows/snake.yml
name: generate snake
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: kunalraha-ai
          outputs: |
            dist/snake.svg?color_snake=%23FF2E63&color_dots=%23120014,%234B0082,%238A2BE2,%23C71585,%23FF2E63
            dist/snake-dark.svg?palette=github-dark&color_snake=%23FF2E63&color_dots=%23120014,%234B0082,%238A2BE2,%23C71585,%23FF2E63
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
